name: Metrics

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia, 06:00 BRT
  workflow_dispatch:      # botão "Run workflow" manual
  push:
    branches: [main, master]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # card principal
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kaincore
          filename: metrics.svg
          template: classic
          config_timezone: America/Sao_Paulo

          # bloco principal: cabeçalho, atividade, comunidade, repositórios
          base: header, activity, community, repositories

          # calendário isométrico de commits
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # linguagens mais usadas
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css

      # frase fortune
      - uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kaincore
          filename: metrics.extras.svg
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_fortune: yes

      # Steam (precisa do secret STEAM_TOKEN)
      - uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kaincore
          filename: metrics.steam.svg
          template: classic
          base: ""
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_user: "76561199059283350"
          plugin_steam_sections: player, most-played, recently-played
          plugin_steam_games_limit: 2
          plugin_steam_recent_games_limit: 2
          plugin_steam_achievements_limit: 2
          plugin_steam_games_ignored: 2669320, 3405690   # EA FC 25 e 26

  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
